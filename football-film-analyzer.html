<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Film Analyzer</title>
  <style>
/* ===== CSS Custom Properties ===== */
:root {
  --bg-primary: #0f0f1a;
  --bg-secondary: #1a1a2e;
  --bg-tertiary: #16213e;
  --bg-surface: #1e2a45;
  --accent: #0f3460;
  --accent-hover: #154a8a;
  --highlight: #e94560;
  --highlight-hover: #ff5a75;
  --text: #e0e0e0;
  --text-dim: #8899aa;
  --text-bright: #ffffff;
  --border: #2a3a55;
  --success: #44ff44;
  --warning: #ffaa00;
  --danger: #ff4444;
  --radius: 6px;
  --radius-sm: 4px;
  --transition: 150ms ease;
}

/* ===== Reset & Base ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg-primary);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

#app {
  display: grid;
  grid-template-rows: 48px 1fr auto;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* ===== Icons ===== */
.icon {
  width: 16px;
  height: 16px;
  fill: currentColor;
  vertical-align: middle;
  flex-shrink: 0;
}

.icon-large {
  width: 48px;
  height: 48px;
}

/* ===== Top Bar ===== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  gap: 12px;
  z-index: 10;
}

.app-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--highlight);
  white-space: nowrap;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.top-bar-center {
  flex: 1;
  display: flex;
  justify-content: center;
}

.file-input-label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  background: var(--bg-tertiary);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-dim);
  transition: all var(--transition);
}

.file-input-label:hover,
.file-input-label.drag-over {
  border-color: var(--highlight);
  color: var(--text);
  background: var(--bg-surface);
}

.top-bar-right {
  display: flex;
  gap: 6px;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  background: var(--bg-tertiary);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}

.btn:hover {
  background: var(--accent);
  border-color: var(--accent-hover);
}

.btn-sm {
  padding: 3px 8px;
  font-size: 11px;
}

.btn-accent {
  background: var(--accent);
  border-color: var(--accent-hover);
}

.btn-accent:hover {
  background: var(--accent-hover);
}

.btn-danger {
  border-color: var(--danger);
  color: var(--danger);
}

.btn-danger:hover {
  background: var(--danger);
  color: var(--text-bright);
}

/* ===== Main Content ===== */
.main-content {
  display: grid;
  grid-template-columns: 1fr 280px;
  overflow: hidden;
}

/* ===== Video Section ===== */
.video-section {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #000;
}

.video-container {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  min-height: 0;
}

.video-container video {
  max-width: 100%;
  max-height: 100%;
  display: block;
  object-fit: contain;
}

.video-container canvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: auto;
  cursor: crosshair;
}

.video-placeholder {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: var(--text-dim);
  font-size: 14px;
}

.video-placeholder.hidden {
  display: none;
}

/* ===== Playback Controls ===== */
.playback-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
}

.controls-left {
  display: flex;
  align-items: center;
  gap: 4px;
}

.ctrl-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  cursor: pointer;
  transition: all var(--transition);
}

.ctrl-btn:hover {
  background: var(--accent);
}

.time-display {
  font-size: 12px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  min-width: 100px;
  margin-left: 6px;
}

.scrub-bar-container {
  flex: 1;
  padding: 0 4px;
}

.scrub-bar {
  position: relative;
  height: 8px;
  background: var(--bg-tertiary);
  border-radius: 4px;
  cursor: pointer;
  overflow: visible;
}

.scrub-bar-fill {
  height: 100%;
  background: var(--accent-hover);
  border-radius: 4px;
  width: 0%;
  pointer-events: none;
}

.scrub-bar-plays {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.scrub-bar-plays .play-marker {
  position: absolute;
  top: 0;
  height: 100%;
  background: var(--highlight);
  opacity: 0.5;
  border-radius: 2px;
}

.scrub-bar-handle {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  background: var(--text-bright);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  left: 0%;
  cursor: grab;
  box-shadow: 0 0 4px rgba(0,0,0,0.5);
}

.controls-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.speed-select {
  background: var(--bg-tertiary);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 6px;
  font-size: 12px;
  cursor: pointer;
}

.fps-label {
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 4px;
}

.fps-input {
  width: 40px;
  background: var(--bg-tertiary);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px 4px;
  font-size: 11px;
  text-align: center;
}

/* ===== Sidebar ===== */
.sidebar {
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar-panel {
  border-bottom: 1px solid var(--border);
}

.panel-title {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
}

.panel-title:hover {
  color: var(--text);
}

.panel-body {
  padding: 8px 12px 12px;
}

.panel-body.collapsed {
  display: none;
}

/* ===== Drawing Tools ===== */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  margin-bottom: 10px;
}

.tool-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px;
  background: var(--bg-tertiary);
  border: 2px solid transparent;
  border-radius: var(--radius);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 10px;
  transition: all var(--transition);
}

.tool-btn:hover {
  color: var(--text);
  background: var(--bg-surface);
}

.tool-btn.active {
  border-color: var(--highlight);
  color: var(--highlight);
  background: var(--bg-surface);
}

.tool-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.color-swatches {
  display: flex;
  gap: 4px;
}

.swatch {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all var(--transition);
}

.swatch:hover {
  transform: scale(1.15);
}

.swatch.active {
  border-color: var(--text-bright);
  box-shadow: 0 0 6px rgba(255,255,255,0.3);
}

.line-width-control {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-dim);
}

.line-width-control input[type="range"] {
  flex: 1;
  accent-color: var(--highlight);
  height: 4px;
}

.tool-actions {
  display: flex;
  gap: 4px;
}

/* ===== Play Tagger ===== */
.play-mark-controls {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
}

.play-selector {
  margin-bottom: 10px;
}

.play-selector label {
  font-size: 11px;
  color: var(--text-dim);
  display: block;
  margin-bottom: 3px;
}

.play-select {
  width: 100%;
  background: var(--bg-tertiary);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 6px;
  font-size: 12px;
}

.tag-form {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.tag-row label {
  font-size: 11px;
  color: var(--text-dim);
  display: block;
  margin-bottom: 2px;
}

.tag-row select,
.tag-row input[type="number"],
.tag-row input[type="text"] {
  width: 100%;
  background: var(--bg-tertiary);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 6px;
  font-size: 12px;
}

.tag-row-inline {
  display: flex;
  align-items: center;
  gap: 6px;
}

.tag-row-inline select,
.tag-row-inline input {
  flex: 1;
}

.tag-row-inline span {
  color: var(--text-dim);
  font-size: 12px;
}

.custom-tags-input {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.tag-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}

.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 6px;
  background: var(--accent);
  border-radius: 10px;
  font-size: 10px;
  color: var(--text);
}

.tag-chip .chip-remove {
  cursor: pointer;
  font-weight: bold;
  opacity: 0.7;
}

.tag-chip .chip-remove:hover {
  opacity: 1;
  color: var(--danger);
}

/* ===== Playlist ===== */
.playlist-controls {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
}

.playlist-list {
  max-height: 200px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.playlist-empty {
  font-size: 11px;
  color: var(--text-dim);
  padding: 8px 0;
  text-align: center;
}

.playlist-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 6px;
  background: var(--bg-tertiary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 11px;
  border: 1px solid transparent;
  transition: all var(--transition);
}

.playlist-item:hover {
  background: var(--bg-surface);
  border-color: var(--border);
}

.playlist-item.active {
  border-color: var(--highlight);
  background: var(--bg-surface);
}

.playlist-num {
  color: var(--text-dim);
  font-weight: 700;
  font-size: 10px;
  min-width: 18px;
  text-align: center;
  background: var(--bg-secondary);
  border-radius: 3px;
  padding: 1px 4px;
}

.playlist-item.active .playlist-num {
  background: var(--highlight);
  color: var(--text-bright);
}

.playlist-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
}

.playlist-dur {
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  font-size: 10px;
}

.playlist-remove {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  padding: 0 2px;
  line-height: 1;
  opacity: 0;
  transition: opacity var(--transition);
}

.playlist-item:hover .playlist-remove {
  opacity: 1;
}

.playlist-remove:hover {
  color: var(--danger);
}

.panel-badge {
  margin-left: auto;
  font-size: 10px;
  font-weight: 400;
  color: var(--text-dim);
  background: var(--bg-tertiary);
  padding: 1px 6px;
  border-radius: 8px;
}

.clip-indicator {
  font-size: 11px;
  color: var(--highlight);
  font-weight: 600;
  margin-left: 4px;
  white-space: nowrap;
}

/* ===== Auto-Detect ===== */
.auto-detect-section {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

.auto-detect-header {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
}

.btn-detect {
  background: #1a4a1a;
  border-color: #2a6a2a;
  color: var(--success);
  flex: 1;
}

.btn-detect:hover {
  background: #2a6a2a;
}

.btn-detect:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-detect.scanning {
  animation: pulse-scan 1.5s ease-in-out infinite;
}

@keyframes pulse-scan {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.auto-detect-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--bg-tertiary);
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--success);
  border-radius: 3px;
  width: 0%;
  transition: width 200ms ease;
}

.progress-label {
  font-size: 10px;
  color: var(--text-dim);
  min-width: 30px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.auto-detect-settings {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 6px;
  padding: 6px;
  background: var(--bg-tertiary);
  border-radius: var(--radius-sm);
}

.detect-setting {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
}

.detect-setting label {
  color: var(--text-dim);
  min-width: 80px;
  flex-shrink: 0;
}

.detect-setting input[type="range"] {
  flex: 1;
  accent-color: var(--success);
  height: 4px;
}

.detect-setting input[type="number"] {
  width: 55px;
  background: var(--bg-surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px 4px;
  font-size: 11px;
  text-align: center;
}

.setting-value {
  font-size: 10px;
  color: var(--text-dim);
  min-width: 28px;
  text-align: right;
}

.btn-link {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 10px;
  padding: 2px 0;
  cursor: pointer;
  text-decoration: underline;
}

.btn-link:hover {
  color: var(--text);
  background: none;
  border: none;
}

.auto-detect-results {
  margin-top: 6px;
}

.detect-results-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
  font-size: 11px;
  color: var(--text-dim);
}

.detect-motion-graph {
  background: var(--bg-tertiary);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  overflow: hidden;
}

.detect-motion-graph canvas {
  width: 100%;
  display: block;
}

/* ===== Bottom Panel ===== */
.bottom-panel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  max-height: 180px;
  min-height: 120px;
}

.notes-section {
  padding: 6px 12px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.notes-section .panel-title {
  padding: 4px 0 6px;
}

.notes-area {
  flex: 1;
  background: var(--bg-tertiary);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  font-size: 12px;
  font-family: 'Menlo', 'Consolas', monospace;
  resize: none;
  line-height: 1.5;
}

.notes-area:focus {
  outline: none;
  border-color: var(--accent-hover);
}

.timeline-section {
  padding: 6px 12px;
  display: flex;
  flex-direction: column;
}

.timeline-section .panel-title {
  padding: 4px 0 6px;
}

.timeline-strip {
  flex: 1;
  position: relative;
  background: var(--bg-tertiary);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  overflow: hidden;
  min-height: 40px;
}

.timeline-bar {
  height: 100%;
  position: relative;
}

.timeline-play {
  position: absolute;
  top: 4px;
  bottom: 4px;
  border-radius: 3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: var(--text-bright);
  font-weight: 600;
  opacity: 0.8;
  transition: opacity var(--transition);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 4px;
}

.timeline-play:hover {
  opacity: 1;
}

.timeline-play.active {
  opacity: 1;
  box-shadow: 0 0 0 2px var(--text-bright);
}

/* Play type colors */
.timeline-play.run { background: #2266cc; }
.timeline-play.pass { background: #22aa44; }
.timeline-play.other { background: #aa6622; }

/* ===== Scrollbar ===== */
.sidebar::-webkit-scrollbar,
.notes-area::-webkit-scrollbar {
  width: 6px;
}

.sidebar::-webkit-scrollbar-track,
.notes-area::-webkit-scrollbar-track {
  background: var(--bg-primary);
}

.sidebar::-webkit-scrollbar-thumb,
.notes-area::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

/* ===== Responsive ===== */
@media (max-width: 900px) {
  .main-content {
    grid-template-columns: 1fr;
  }
  .sidebar {
    border-left: none;
    border-top: 1px solid var(--border);
    max-height: 250px;
  }
  .bottom-panel {
    grid-template-columns: 1fr;
  }
  .top-bar-right .btn span {
    display: none;
  }
}

/* ===== Quick Chart Button ===== */
.btn-highlight {
  background: var(--highlight);
  border-color: var(--highlight);
  color: var(--text-bright);
  font-weight: 600;
}

.btn-highlight:hover {
  background: var(--highlight-hover);
  border-color: var(--highlight-hover);
}

.btn-highlight.active {
  background: var(--highlight-hover);
  box-shadow: 0 0 0 2px var(--text-bright);
}

/* ===== Quick Chart Panel ===== */
.quick-chart-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  background: var(--bg-secondary);
  border-top: 2px solid var(--highlight);
  padding: 8px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.qc-main {
  display: flex;
  align-items: center;
  gap: 16px;
}

.qc-fields {
  display: flex;
  gap: 8px;
  flex: 1;
}

.qc-field {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 70px;
}

.qc-label {
  font-size: 9px;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

.qc-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-dim);
  padding: 2px 10px;
  background: var(--bg-tertiary);
  border-radius: var(--radius-sm);
  border: 2px solid transparent;
  min-width: 60px;
  text-align: center;
  white-space: nowrap;
}

.qc-value.qc-set {
  color: var(--text-bright);
  border-color: var(--highlight);
  background: var(--bg-surface);
}

.qc-players {
  display: flex;
  gap: 6px;
  border-left: 1px solid var(--border);
  padding-left: 16px;
}

.qc-player-field {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.qc-player-field label {
  font-size: 9px;
  color: var(--text-dim);
  margin-bottom: 2px;
  text-transform: uppercase;
  font-weight: 600;
}

.qc-player-field input {
  width: 42px;

// ===== video-controller.js =====
/**
 * VideoController - Manages video loading, playback, and frame-by-frame controls.
 */
class VideoController {
  constructor() {
    this.video = document.getElementById('videoPlayer');
    this.placeholder = document.getElementById('videoPlaceholder');
    this.fileInput = document.getElementById('videoFileInput');
    this.dropZone = document.getElementById('videoDropZone');
    this.fileLabel = document.getElementById('fileLabel');
    this.btnPlayPause = document.getElementById('btnPlayPause');
    this.iconPlayPause = document.getElementById('iconPlayPause');
    this.btnStepBack = document.getElementById('btnStepBack');
    this.btnStepForward = document.getElementById('btnStepForward');
    this.timeDisplay = document.getElementById('timeDisplay');
    this.scrubBar = document.getElementById('scrubBar');
    this.scrubBarFill = document.getElementById('scrubBarFill');
    this.scrubBarHandle = document.getElementById('scrubBarHandle');
    this.speedSelect = document.getElementById('speedSelect');
    this.fpsInput = document.getElementById('fpsInput');

    this.fps = 30;
    this.objectUrl = null;
    this.isScrubbing = false;
    this.listeners = {};

    this._bindEvents();
  }

  _bindEvents() {
    // File input — supports multiple files
    this.fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('video/'));
      if (files.length > 0) {
        this._emit('files-selected', { files });
      }
    });

    // Drag and drop — supports multiple files
    this.dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      this.dropZone.classList.add('drag-over');
    });
    this.dropZone.addEventListener('dragleave', () => {
      this.dropZone.classList.remove('drag-over');
    });
    this.dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      this.dropZone.classList.remove('drag-over');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('video/'));
      if (files.length > 0) {
        this._emit('files-selected', { files });
      }
    });

    // Playback controls
    this.btnPlayPause.addEventListener('click', () => this.togglePlay());
    this.btnStepBack.addEventListener('click', () => this.stepBack());
    this.btnStepForward.addEventListener('click', () => this.stepForward());

    // Speed
    this.speedSelect.addEventListener('change', () => {
      this.video.playbackRate = parseFloat(this.speedSelect.value);
    });

    // FPS
    this.fpsInput.addEventListener('change', () => {
      this.fps = parseInt(this.fpsInput.value) || 30;
    });

    // Video events
    this.video.addEventListener('loadedmetadata', () => {
      this.placeholder.classList.add('hidden');
      this._updateTime();
      this._emit('video-loaded', {
        duration: this.video.duration,
        width: this.video.videoWidth,
        height: this.video.videoHeight
      });
    });

    this.video.addEventListener('timeupdate', () => {
      if (!this.isScrubbing) {
        this._updateScrubBar();
        this._updateTime();
      }
      this._emit('time-update', { time: this.video.currentTime });
    });

    this.video.addEventListener('play', () => {
      this._updatePlayPauseIcon(true);
      this._emit('play-state-change', { playing: true });
    });

    this.video.addEventListener('pause', () => {
      this._updatePlayPauseIcon(false);
      this._emit('play-state-change', { playing: false });
    });

    this.video.addEventListener('ended', () => {
      this._updatePlayPauseIcon(false);
    });

    // Scrub bar interaction
    this.scrubBar.addEventListener('mousedown', (e) => this._startScrub(e));
    document.addEventListener('mousemove', (e) => {
      if (this.isScrubbing) this._doScrub(e);
    });
    document.addEventListener('mouseup', () => {
      if (this.isScrubbing) this._endScrub();
    });
  }

  loadFile(file) {
    if (this.objectUrl) {
      URL.revokeObjectURL(this.objectUrl);
    }
    this.objectUrl = URL.createObjectURL(file);
    this.video.src = this.objectUrl;
    this.video.load();
    this.fileLabel.textContent = file.name;
    this._emit('file-loaded', { name: file.name });
  }

  togglePlay() {
    if (!this.video.src) return;
    if (this.video.paused) {
      this.video.play();
    } else {
      this.video.pause();
    }
  }

  stepForward() {
    if (!this.video.src) return;
    this.video.pause();
    this.video.currentTime = Math.min(
      this.video.currentTime + 1 / this.fps,
      this.video.duration
    );
    this._updateScrubBar();
    this._updateTime();
    this._emit('time-update', { time: this.video.currentTime });
  }

  stepBack() {
    if (!this.video.src) return;
    this.video.pause();
    this.video.currentTime = Math.max(this.video.currentTime - 1 / this.fps, 0);
    this._updateScrubBar();
    this._updateTime();
    this._emit('time-update', { time: this.video.currentTime });
  }

  seekTo(time) {
    if (!this.video.src) return;
    this.video.currentTime = Math.max(0, Math.min(time, this.video.duration));
    this._updateScrubBar();
    this._updateTime();
  }

  get currentTime() {
    return this.video.currentTime;
  }

  get duration() {
    return this.video.duration || 0;
  }

  get paused() {
    return this.video.paused;
  }

  get videoElement() {
    return this.video;
  }

  _startScrub(e) {
    this.isScrubbing = true;
    this._doScrub(e);
  }

  _doScrub(e) {
    const rect = this.scrubBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    this.video.currentTime = pct * this.video.duration;
    this._setScrubPosition(pct);
    this._updateTime();
    this._emit('time-update', { time: this.video.currentTime });
  }

  _endScrub() {
    this.isScrubbing = false;
  }

  _updateScrubBar() {
    if (!this.video.duration) return;
    const pct = this.video.currentTime / this.video.duration;
    this._setScrubPosition(pct);
  }

  _setScrubPosition(pct) {
    const pctStr = (pct * 100) + '%';
    this.scrubBarFill.style.width = pctStr;
    this.scrubBarHandle.style.left = pctStr;
  }

  _updateTime() {
    const cur = this._formatTime(this.video.currentTime);
    const dur = this._formatTime(this.video.duration || 0);
    this.timeDisplay.textContent = `${cur} / ${dur}`;
  }

  _formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  _updatePlayPauseIcon(playing) {
    const use = this.iconPlayPause.querySelector('use');
    if (use) {
      use.setAttribute('href', `#icon-${playing ? 'pause' : 'play'}`);
    }
  }

  // Simple event system
  on(event, callback) {
    if (!this.listeners[event]) this.listeners[event] = [];
    this.listeners[event].push(callback);
  }

  _emit(event, data) {
    (this.listeners[event] || []).forEach(cb => cb(data));
  }
}

// ===== canvas-overlay.js =====
/**
 * CanvasOverlay - Manages the HTML5 Canvas drawing surface overlaid on video.
 * Handles coordinate transforms, resize syncing, and rendering.
 */
class CanvasOverlay {
  constructor(videoController) {
    this.vc = videoController;
    this.canvas = document.getElementById('drawingCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.container = document.getElementById('videoContainer');

    this.currentTool = null;
    this.color = '#ffffff';
    this.lineWidth = 3;
    this.isDrawing = false;
    this.drawStart = null;
    this.drawPoints = [];
    this.annotations = []; // master list, shared with app state
    this.undoStack = [];
    this.redoStack = [];

    this._resizeObserver = new ResizeObserver(() => this._syncSize());
    this._resizeObserver.observe(this.container);

    this.vc.on('video-loaded', () => {
      requestAnimationFrame(() => this._syncSize());
    });

    this._bindDrawingEvents();
  }

  _syncSize() {
    const video = this.vc.videoElement;
    if (!video.videoWidth) {
      // No video loaded yet, fill container
      this.canvas.width = this.container.clientWidth * devicePixelRatio;
      this.canvas.height = this.container.clientHeight * devicePixelRatio;
      this.canvas.style.width = this.container.clientWidth + 'px';
      this.canvas.style.height = this.container.clientHeight + 'px';
      this.canvas.style.top = '0px';
      this.canvas.style.left = '0px';
      return;
    }

    // Calculate the actual rendered area of the video (object-fit: contain)
    const containerW = this.container.clientWidth;
    const containerH = this.container.clientHeight;
    const videoAspect = video.videoWidth / video.videoHeight;
    const containerAspect = containerW / containerH;

    let renderW, renderH, offsetX, offsetY;
    if (containerAspect > videoAspect) {
      // Pillarboxed
      renderH = containerH;
      renderW = containerH * videoAspect;
      offsetX = (containerW - renderW) / 2;
      offsetY = 0;
    } else {
      // Letterboxed
      renderW = containerW;
      renderH = containerW / videoAspect;
      offsetX = 0;
      offsetY = (containerH - renderH) / 2;
    }

    this.canvas.style.left = offsetX + 'px';
    this.canvas.style.top = offsetY + 'px';
    this.canvas.style.width = renderW + 'px';
    this.canvas.style.height = renderH + 'px';
    this.canvas.width = Math.round(renderW * devicePixelRatio);
    this.canvas.height = Math.round(renderH * devicePixelRatio);

    this.render();
  }

  _bindDrawingEvents() {
    this.canvas.addEventListener('mousedown', (e) => this._onStart(e));
    this.canvas.addEventListener('mousemove', (e) => this._onMove(e));
    this.canvas.addEventListener('mouseup', (e) => this._onEnd(e));
    this.canvas.addEventListener('mouseleave', (e) => {
      if (this.isDrawing) this._onEnd(e);
    });

    // Touch support
    this.canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this._onStart(e.touches[0]);
    }, { passive: false });
    this.canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      this._onMove(e.touches[0]);
    }, { passive: false });
    this.canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      this._onEnd(e.changedTouches[0]);
    }, { passive: false });
  }

  _getCanvasPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  toNormalized(canvasX, canvasY) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: canvasX / rect.width,
      y: canvasY / rect.height
    };
  }

  toCanvas(normX, normY) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: normX * rect.width,
      y: normY * rect.height
    };
  }

  _toCtx(canvasX, canvasY) {
    return {
      x: canvasX * devicePixelRatio,
      y: canvasY * devicePixelRatio
    };
  }

  _onStart(e) {
    if (!this.currentTool) return;
    this.isDrawing = true;
    const pos = this._getCanvasPos(e);
    this.drawStart = pos;
    this.drawPoints = [pos];

    if (this.currentTool === 'text') {
      this.isDrawing = false;
      this._promptText(pos);
    }
  }

  _onMove(e) {
    if (!this.isDrawing || !this.currentTool) return;
    const pos = this._getCanvasPos(e);
    this.drawPoints.push(pos);
    this.render();
    this._renderPreview(pos);
  }

  _onEnd(e) {
    if (!this.isDrawing || !this.currentTool) return;
    this.isDrawing = false;
    const pos = this._getCanvasPos(e);
    this.drawPoints.push(pos);
    this._finalizeAnnotation(pos);
  }

  _promptText(pos) {
    const norm = this.toNormalized(pos.x, pos.y);
    const text = prompt('Enter text:');
    if (text) {
      const annotation = {
        tool: 'text',
        position: norm,
        text: text,
        color: this.color,
        lineWidth: this.lineWidth,
        timestamp: this.vc.currentTime
      };
      this._addAnnotation(annotation);
    }
  }

  _finalizeAnnotation(endPos) {
    const startNorm = this.toNormalized(this.drawStart.x, this.drawStart.y);
    const endNorm = this.toNormalized(endPos.x, endPos.y);
    let annotation = null;

    switch (this.currentTool) {
      case 'line':
        annotation = {
          tool: 'line',
          start: startNorm,
          end: endNorm,
          color: this.color,
          lineWidth: this.lineWidth,
          timestamp: this.vc.currentTime
        };
        break;
      case 'arrow':
        annotation = {
          tool: 'arrow',
          start: startNorm,
          end: endNorm,
          color: this.color,
          lineWidth: this.lineWidth,
          timestamp: this.vc.currentTime
        };
        break;
      case 'circle':
        const dx = endNorm.x - startNorm.x;
        const dy = endNorm.y - startNorm.y;
        const radius = Math.sqrt(dx * dx + dy * dy);
        annotation = {
          tool: 'circle',
          center: startNorm,
          radius: radius,
          color: this.color,
          lineWidth: this.lineWidth,
          timestamp: this.vc.currentTime
        };
        break;
      case 'rect':
        annotation = {
          tool: 'rect',
          origin: { x: Math.min(startNorm.x, endNorm.x), y: Math.min(startNorm.y, endNorm.y) },
          size: { w: Math.abs(endNorm.x - startNorm.x), h: Math.abs(endNorm.y - startNorm.y) },
          color: this.color,
          lineWidth: this.lineWidth,
          timestamp: this.vc.currentTime
        };
        break;
      case 'freehand':
        const points = this.drawPoints.map(p => this.toNormalized(p.x, p.y));
        annotation = {
          tool: 'freehand',
          points: this._simplifyPoints(points, 0.002),
          color: this.color,
          lineWidth: this.lineWidth,
          timestamp: this.vc.currentTime
        };
        break;
    }

    if (annotation) {
      this._addAnnotation(annotation);
    }
  }

  _addAnnotation(annotation) {
    this.annotations.push(annotation);
    this.undoStack.push({ action: 'add', index: this.annotations.length - 1 });
    this.redoStack = [];
    this.render();
    this._emit('annotation-added', annotation);
  }

  undo() {
    if (this.undoStack.length === 0) return;
    const op = this.undoStack.pop();
    if (op.action === 'add') {
      const removed = this.annotations.splice(op.index, 1)[0];
      this.redoStack.push({ action: 'add', annotation: removed, index: op.index });
    }
    this.render();
    this._emit('annotations-changed');
  }

  redo() {
    if (this.redoStack.length === 0) return;
    const op = this.redoStack.pop();
    if (op.action === 'add') {
      this.annotations.splice(op.index, 0, op.annotation);
      this.undoStack.push({ action: 'add', index: op.index });
    }
    this.render();
    this._emit('annotations-changed');
  }

  clearAnnotationsForTime(timestamp, tolerance) {
    const frameDur = 1 / (parseInt(this.vc.fpsInput?.value) || 30);
    const tol = tolerance || frameDur / 2;
    this.annotations = this.annotations.filter(
      a => Math.abs(a.timestamp - timestamp) > tol
    );
    this.undoStack = [];
    this.redoStack = [];
    this.render();
    this._emit('annotations-changed');
  }

  clearAllAnnotations() {
    this.annotations = [];
    this.undoStack = [];
    this.redoStack = [];
    this.render();
    this._emit('annotations-changed');
  }

  render() {
    const ctx = this.ctx;
    const dpr = devicePixelRatio;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.save();
    ctx.scale(dpr, dpr);

    const rect = this.canvas.getBoundingClientRect();
    const currentTime = this.vc.currentTime;
    const frameDur = 1 / (parseInt(this.vc.fpsInput?.value) || 30);

    // Render finalized annotations near current time
    for (const a of this.annotations) {
      if (Math.abs(a.timestamp - currentTime) <= frameDur / 2) {
        this._renderAnnotation(ctx, a, rect.width, rect.height);
      }
    }

    ctx.restore();
  }

  _renderPreview(currentPos) {
    if (!this.drawStart || !this.currentTool) return;

    const ctx = this.ctx;
    const dpr = devicePixelRatio;
    ctx.save();
    ctx.scale(dpr, dpr);

    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.lineWidth;
    ctx.setLineDash([5, 5]);

    switch (this.currentTool) {
      case 'line':
        ctx.beginPath();
        ctx.moveTo(this.drawStart.x, this.drawStart.y);
        ctx.lineTo(currentPos.x, currentPos.y);
        ctx.stroke();
        break;
      case 'arrow':
        ctx.beginPath();
        ctx.moveTo(this.drawStart.x, this.drawStart.y);
        ctx.lineTo(currentPos.x, currentPos.y);
        ctx.stroke();
        this._drawArrowHead(ctx, this.drawStart.x, this.drawStart.y, currentPos.x, currentPos.y);
        break;
      case 'circle': {
        const dx = currentPos.x - this.drawStart.x;
        const dy = currentPos.y - this.drawStart.y;
        const r = Math.sqrt(dx * dx + dy * dy);
        ctx.beginPath();
        ctx.arc(this.drawStart.x, this.drawStart.y, r, 0, Math.PI * 2);
        ctx.stroke();
        break;
      }
      case 'rect': {
        const x = Math.min(this.drawStart.x, currentPos.x);
        const y = Math.min(this.drawStart.y, currentPos.y);
        const w = Math.abs(currentPos.x - this.drawStart.x);
        const h = Math.abs(currentPos.y - this.drawStart.y);
        ctx.strokeRect(x, y, w, h);
        break;
      }
      case 'freehand':
        if (this.drawPoints.length > 1) {
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(this.drawPoints[0].x, this.drawPoints[0].y);
          for (let i = 1; i < this.drawPoints.length; i++) {
            ctx.lineTo(this.drawPoints[i].x, this.drawPoints[i].y);
          }
          ctx.stroke();
        }
        break;
    }

    ctx.restore();
  }

  _renderAnnotation(ctx, a, w, h) {
    ctx.strokeStyle = a.color;
    ctx.fillStyle = a.color;
    ctx.lineWidth = a.lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash([]);

    switch (a.tool) {
      case 'line': {
        const s = { x: a.start.x * w, y: a.start.y * h };
        const e = { x: a.end.x * w, y: a.end.y * h };
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(e.x, e.y);
        ctx.stroke();
        break;
      }
      case 'arrow': {
        const s = { x: a.start.x * w, y: a.start.y * h };
        const e = { x: a.end.x * w, y: a.end.y * h };
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(e.x, e.y);
        ctx.stroke();
        this._drawArrowHead(ctx, s.x, s.y, e.x, e.y);
        break;
      }
      case 'circle': {
        const c = { x: a.center.x * w, y: a.center.y * h };
        const r = a.radius * Math.max(w, h);
        ctx.beginPath();
        ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
        ctx.stroke();
        break;
      }
      case 'rect': {
        const ox = a.origin.x * w;
        const oy = a.origin.y * h;
        const rw = a.size.w * w;
        const rh = a.size.h * h;
        ctx.strokeRect(ox, oy, rw, rh);
        break;
      }
      case 'freehand': {
        if (a.points.length < 2) break;
        ctx.beginPath();
        ctx.moveTo(a.points[0].x * w, a.points[0].y * h);
        for (let i = 1; i < a.points.length; i++) {
          ctx.lineTo(a.points[i].x * w, a.points[i].y * h);
        }
        ctx.stroke();
        break;
      }
      case 'text': {
        const pos = { x: a.position.x * w, y: a.position.y * h };
        const fontSize = Math.max(14, a.lineWidth * 5);
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.fillText(a.text, pos.x, pos.y);
        break;
      }
    }
  }

  _drawArrowHead(ctx, fromX, fromY, toX, toY) {
    const angle = Math.atan2(toY - fromY, toX - fromX);
    const headLen = Math.max(10, ctx.lineWidth * 4);
    const headAngle = Math.PI / 7;

    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(toX, toY);
    ctx.lineTo(
      toX - headLen * Math.cos(angle - headAngle),
      toY - headLen * Math.sin(angle - headAngle)
    );
    ctx.lineTo(
      toX - headLen * Math.cos(angle + headAngle),
      toY - headLen * Math.sin(angle + headAngle)
    );
    ctx.closePath();
    ctx.fill();
  }

  // Ramer-Douglas-Peucker simplification
  _simplifyPoints(points, epsilon) {
    if (points.length <= 2) return points;

    let maxDist = 0;
    let maxIdx = 0;
    const start = points[0];
    const end = points[points.length - 1];

    for (let i = 1; i < points.length - 1; i++) {
      const d = this._perpendicularDist(points[i], start, end);
      if (d > maxDist) {
        maxDist = d;
        maxIdx = i;
      }
    }

    if (maxDist > epsilon) {
      const left = this._simplifyPoints(points.slice(0, maxIdx + 1), epsilon);
      const right = this._simplifyPoints(points.slice(maxIdx), epsilon);
      return left.slice(0, -1).concat(right);
    }
    return [start, end];
  }

  _perpendicularDist(point, lineStart, lineEnd) {
    const dx = lineEnd.x - lineStart.x;
    const dy = lineEnd.y - lineStart.y;
    const lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Math.sqrt((point.x - lineStart.x) ** 2 + (point.y - lineStart.y) ** 2);
    const t = Math.max(0, Math.min(1, ((point.x - lineStart.x) * dx + (point.y - lineStart.y) * dy) / lenSq));
    const projX = lineStart.x + t * dx;
    const projY = lineStart.y + t * dy;
    return Math.sqrt((point.x - projX) ** 2 + (point.y - projY) ** 2);
  }

  // Event system
  on(event, callback) {
    if (!this._listeners) this._listeners = {};
    if (!this._listeners[event]) this._listeners[event] = [];
    this._listeners[event].push(callback);
  }

  _emit(event, data) {
    if (!this._listeners) return;
    (this._listeners[event] || []).forEach(cb => cb(data));
  }
}
