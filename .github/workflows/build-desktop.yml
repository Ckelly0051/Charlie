name: Build Desktop Installers

# Builds native installers on real OS runners (Windows .msi/.exe, macOS .dmg,
# Linux .deb/.AppImage). Cross-compiling Windows from Linux isn't viable
# (needs the MSVC runtime), so the desktop installers are produced here.
#
# - Manual run (Actions tab -> "Run workflow"): builds and uploads each
#   installer as a downloadable artifact on the run.
# - Tag push (v1.0.0, v1.1.0, ...): also publishes a GitHub Release with the
#   installers attached.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Allow the workflow token to create the GitHub Release on tag builds.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gridiron-iq-windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: gridiron-iq-macos
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: gridiron-iq-linux
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Prepare frontend bundle
        shell: bash
        run: |
          mkdir -p dist
          cp football-film-analyzer.html dist/index.html

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Normalize signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # The Tauri signer rejects a key with stray newlines ("Invalid symbol
          # 10"). A pasted GitHub secret often carries a trailing newline, so
          # strip all CR/LF before handing it to the build. Single-line base64,
          # so this is safe.
          echo "TAURI_SIGNING_PRIVATE_KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n')" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(printf '%s' "$RAW_PW" | tr -d '\r\n')" >> "$GITHUB_ENV"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] are injected (newline-stripped)
          # by the "Normalize signing key" step above via $GITHUB_ENV.
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('GridIron IQ {0}', github.ref_name) || '' }}
          releaseDraft: false
          releaseBody: 'Desktop installers for GridIron IQ. Windows users: grab the .exe (NSIS) or .msi.'

      - name: Upload installers as artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
