<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridIron IQ</title>
  <meta name="theme-color" content="#0B0F14">
  <meta name="description" content="Football film analysis for coaches — tag plays, track stats, scout opponents.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/redesign-stats.css">
  <link rel="stylesheet" href="css/workspace-shell.css">
  <link rel="stylesheet" href="css/study-screen.css">
  <link rel="stylesheet" href="css/plan-screen.css">
</head>
<body>
  <div id="giNativeRoot" data-gi-overlay-host></div>
  <!-- Native More owns the visible Open command; this nonvisual picker lives
       outside the legacy app so file loading survives final outlet deletion. -->
  <input type="file" id="projectFileInput" accept=".json" hidden>
  <!-- Native Film settings owns these nonvisual pickers. Keep them outside
       #app so linked/imported film survives final legacy-outlet deletion. -->
  <input type="file" id="clipFileInput" accept="video/*" multiple hidden>
  <input type="file" id="repairFilmInput" webkitdirectory directory multiple hidden>
  <!-- S7-b: the two film pickers. They were inside the top bar, which S7-d
       deletes; the native empty-state CTA and Film settings both click them, so
       losing them would take film loading with the legacy markup. -->
  <input type="file" id="videoFileInput" accept="video/*" multiple hidden>
  <input type="file" id="videoFolderInput" webkitdirectory directory multiple hidden>
  <input type="file" id="angle2FileInput" accept="video/*" hidden>
  <!-- Permanent media foundation: only the real video/canvas/angle/empty-state
       nodes live here. Native Breakdown owns all transport and play controls. -->
  <div id="giMediaHost" class="gi-media-host" hidden>
          <div class="video-container" id="videoContainer">
            <span class="brand-bug" aria-hidden="true">GridIron <b>IQ</b></span>
            <div class="angle-wrapper" id="angleWrapper1">
              <video id="videoPlayer" preload="auto" playsinline></video>
              <canvas id="drawingCanvas"></canvas>
              <span class="angle-badge" id="angleLabel1">Angle 1</span>
            </div>
            <div class="angle-wrapper angle-wrapper-2" id="angleWrapper2">
              <video id="videoPlayer2" preload="auto" playsinline></video>
              <span class="angle-badge" id="angleLabel2">Angle 2</span>
            </div>
            <div class="video-placeholder" id="videoPlaceholder">
              <svg class="icon icon-large"><use href="assets/icons.svg#icon-film"/></svg>
              <p>Load a video file to begin</p>
            </div>
            <div class="video-load-state hidden" id="videoLoadState" role="status" aria-live="polite">
              <span class="video-load-spinner" aria-hidden="true"></span>
              <span id="videoLoadStateText">Loading film</span>
            </div>
          </div>
  </div>
  <!-- Final Engine Independence: PlayTagger's tag/player/grade fields are
       DOM-free (js/play-tagger.js's PlainField/PlainInput) and the coach
       tag form (native-tagging.jsx) never reads this markup. Auto-Detect's
       scan/progress/settings/results/Review/Apply are now a real native
       operation + state API (js/auto-detect-screen.js) rendered as a visible
       NativeOverlayService sheet (js/native-autodetect.jsx) -- the prior
       #giAutoDetectHost this comment used to describe is deleted, not hidden.
       Its Review step opens a modal that was always appended directly to
       document.body (never inside the hidden host); that construction is
       unchanged, only relocated onto AutoDetectScreen. -->
  <!-- Final Engine Independence: #giLegacyEngineHost is deleted. It held two
       generations of legacy markup, both now genuinely gone: #playGridSection
       (native Film Room, native-film-room.jsx via NativeFilmRoomScreen, has
       owned presentation through PlayGrid's DOM-free native*()/
       nativeSnapshot() API all along) and the classic top-bar chrome
       (#btnSidebarToggle/#btnShortcuts/#videoDropZone/#btnLoadFolder/
       #backendStatusBadge/#btnUndoAction/#btnRedoAction/#btnQuickChart/
       #btnShowStats/#btnSave). Every one of those controls now has a real
       native owner that calls the underlying service directly instead of
       adopting/relocating/`.click()`-proxying a hidden legacy element:
       Undo/Redo/Shortcuts/Settings are WorkspaceShell's own
       `.ws-global-tools` buttons; film loading is the native empty-state CTA
       (ui-polish.js `_initEmptyStateCTA`) plus Settings' film-storage tools;
       Quick Chart is the Break Down toolbar's [data-bd-context="quick"];
       Stats/Reports is [data-ws-route="reports"]; Save is the More menu's
       "Save season" (and Ctrl+S). The optional local CV server's status/
       enable action -- unreachable while it lived on this hidden badge --
       now lives in Settings -> Analysis (SettingsScreen.enableLocalServer()). -->

  <script type="module" src="js/native-root.jsx"></script>
  <script type="module" src="js/legacy-global-bridge.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
