<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridIron IQ</title>
  <meta name="theme-color" content="#0B0F14">
  <meta name="description" content="Football film analysis for coaches — tag plays, track stats, scout opponents.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/redesign-stats.css">
  <link rel="stylesheet" href="css/workspace-shell.css">
  <link rel="stylesheet" href="css/breakdown-video.css">
  <link rel="stylesheet" href="css/study-screen.css">
  <link rel="stylesheet" href="css/plan-screen.css">

  <link rel="stylesheet" href="css/breakdown-form.css">
</head>
<body>
  <div id="giNativeRoot" data-gi-overlay-host></div>
  <!-- Native More owns the visible Open command; this nonvisual picker lives
       outside the legacy app so file loading survives final outlet deletion. -->
  <input type="file" id="projectFileInput" accept=".json" hidden>
  <!-- Native Film settings owns these nonvisual pickers. Keep them outside
       #app so linked/imported film survives final legacy-outlet deletion. -->
  <input type="file" id="clipFileInput" accept="video/*" multiple hidden>
  <input type="file" id="repairFilmInput" webkitdirectory directory multiple hidden>
  <!-- S7-b: the two film pickers. They were inside the top bar, which S7-d
       deletes; the native empty-state CTA and Film settings both click them, so
       losing them would take film loading with the legacy markup. -->
  <input type="file" id="videoFileInput" accept="video/*" multiple hidden>
  <input type="file" id="videoFolderInput" webkitdirectory directory multiple hidden>
  <!-- S7-d2: the permanent media foundation. The one canonical media
       subtree — video, drawing canvas, multi-angle wrappers, transport,
       scrub/timeline and the play-control bar — lives here, OUTSIDE #app,
       so S7-d8 cannot take film with the legacy shell. BreakdownTheater
       adopts it into the route and parks it back here; this host is that
       permanent home, not an ephemeral route container. -->
  <div id="giMediaHost" class="gi-media-host" hidden>
  <div class="video-section">
          <div class="video-container" id="videoContainer">
            <span class="brand-bug" aria-hidden="true">GridIron <b>IQ</b></span>
            <div class="angle-wrapper" id="angleWrapper1">
              <video id="videoPlayer" preload="auto" playsinline></video>
              <canvas id="drawingCanvas"></canvas>
              <span class="angle-badge" id="angleLabel1">Angle 1</span>
            </div>
            <div class="angle-wrapper angle-wrapper-2" id="angleWrapper2">
              <video id="videoPlayer2" preload="auto" playsinline></video>
              <span class="angle-badge" id="angleLabel2">Angle 2</span>
            </div>
            <div class="video-placeholder" id="videoPlaceholder">
              <svg class="icon icon-large"><use href="assets/icons.svg#icon-film"/></svg>
              <p>Load a video file to begin</p>
            </div>
          </div>

          <!-- Playback Controls -->
          <div class="playback-controls">
            <div class="controls-left">
              <button class="ctrl-btn" id="btnPrevClip" title="Previous Clip (Shift+Left)">
                <svg class="icon"><use href="assets/icons.svg#icon-prev-clip"/></svg>
              </button>
              <button class="ctrl-btn" id="btnStepBack" title="Step Back (Left Arrow)">
                <svg class="icon"><use href="assets/icons.svg#icon-step-back"/></svg>
              </button>
              <button class="ctrl-btn" id="btnPlayPause" title="Play/Pause (Space)">
                <svg class="icon" id="iconPlayPause"><use href="assets/icons.svg#icon-play"/></svg>
              </button>
              <button class="ctrl-btn" id="btnStepForward" title="Step Forward (Right Arrow)">
                <svg class="icon"><use href="assets/icons.svg#icon-step-forward"/></svg>
              </button>
              <button class="ctrl-btn" id="btnNextClip" title="Next Clip (Shift+Right)">
                <svg class="icon"><use href="assets/icons.svg#icon-next-clip"/></svg>
              </button>
              <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
              <span class="clip-indicator" id="clipIndicator"></span>
            </div>
            <div class="transport-center">
              <div class="scrub-bar-container">
                <div class="scrub-bar" id="scrubBar">
                  <div class="scrub-bar-fill" id="scrubBarFill"></div>
                  <div class="scrub-bar-plays" id="scrubBarPlays"></div>
                  <div class="scrub-bar-handle" id="scrubBarHandle"></div>
                </div>
              </div>
              <!-- Timeline folds into the transport line's center (no dedicated row) -->
              <div class="video-timeline">
                <div class="timeline-strip" id="timelineStrip">
                  <div class="timeline-bar" id="timelineBar"></div>
                </div>
              </div>
            </div>
            <div class="controls-right">
              <button class="ctrl-btn" id="btnLoop" title="Loop the current play (toggle)">
                <svg class="icon"><use href="assets/icons.svg#icon-loop"/></svg>
              </button>
              <button class="ctrl-btn ab-btn" id="btnLoopA" title="Set A — loop start">A</button>
              <button class="ctrl-btn ab-btn" id="btnLoopB" title="Set B — loop end">B</button>
              <select id="speedSelect" class="speed-select" title="Playback Speed">
                <option value="0.25">0.25x</option>
                <option value="0.5">0.5x</option>
                <option value="1" selected>1x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
              </select>
              <label class="fps-label" title="Video frame rate">
                FPS: <input type="number" id="fpsInput" value="30" min="1" max="120" class="fps-input">
              </label>
              <button class="ctrl-btn" id="btnExpandVideo" title="Expand the video to full screen (Esc to exit)">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
              </button>
            </div>
          </div>

          <!-- Multi-angle controls -->
          <div class="angle-controls" id="angleControls">
            <input type="file" id="angle2FileInput" accept="video/*" hidden>
            <span class="angle2-info hidden" id="angle2Info">
              <span class="angle2-name" id="angle2Name"></span>
              <select id="angleViewMode" class="speed-select" title="View layout">
                <option value="single">Toggle</option>
                <option value="sideBySide">Side by Side</option>
                <option value="pip">Picture-in-Picture</option>
              </select>
              <button class="ctrl-btn" id="btnSwapAngle" title="Swap active angle (V)">⇄</button>
              <label class="angle-sync-label" title="Time offset for angle 2 (seconds)">
                Sync: <input type="number" id="angleSyncOffset" value="0" step="0.1" class="fps-input" style="width:52px">s
              </label>
              <button class="ctrl-btn angle-remove-btn" id="btnRemoveAngle" title="Remove second angle">✕</button>
            </span>
          </div>

          <!-- Play marking + selector (moved under the video to use the dead space) -->
          <div class="video-play-controls">
            <button class="btn btn-sm btn-accent" id="btnMarkStart" title="Mark Play Start ([)">Mark Start</button>
            <button class="btn btn-sm btn-accent" id="btnMarkEnd" title="Mark Play End (])">Mark End</button>
            <button class="btn btn-sm" id="btnClearTags" title="Reset this play's tags (keeps the play and video)">Clear Tags</button>
            <button class="btn btn-sm btn-danger" id="btnDeletePlay" title="Delete this play and unload the video (the source file is not deleted)">Delete Play</button>
            <button class="btn btn-sm" id="btnAddAngle" title="Load a second camera angle (e.g., end zone)">+ Angle</button>
            <label class="autoplay-next-toggle" title="When moving to another play, start its film automatically">
              <input type="checkbox" id="autoplayNextToggle" checked>
              <span>Autoplay next</span>
            </label>
            <select id="playSelect" class="play-select" title="Current play">
              <option value="">No plays yet</option>
            </select>
          </div>
        </div>
  </div>
  <!-- Final Engine Independence: PlayTagger's tag/player/grade fields are
       DOM-free (js/play-tagger.js's PlainField/PlainInput) and the coach
       tag form (native-tagging.jsx) never reads this markup. The one
       deliberately retained legacy control surface is auto-detect: its
       ~175-line scan-progress UI (progress bar, live status, motion-graph
       canvas, strictness/duration/cooldown settings) is App._bindAutoDetect's
       own presentation, not a proxy for domain state, and building a native
       equivalent is a dedicated feature-level project — reported here rather
       than rushed. NativeTaggingScreen.runAutoDetect() reaches it via one
       explicit, disclosed click() passthrough. -->
  <div id="giAutoDetectHost" class="gi-autodetect-host" hidden>
          <!-- Auto-Detect (experimental) -->
          <details class="tagger-tools auto-detect-tools">
            <summary>Auto-Detect Plays (experimental)</summary>
            <div class="tagger-tools-body">
              <div class="auto-detect-section">
                <div class="auto-detect-header">
                  <button class="btn btn-sm btn-detect" id="btnAutoDetect" title="Scan video to auto-detect plays">
                    <svg class="icon"><use href="assets/icons.svg#icon-scan"/></svg>
                    Auto-Detect Plays
                  </button>
                  <button class="btn btn-sm btn-danger hidden" id="btnCancelScan">Cancel</button>
                </div>
                <div class="auto-detect-progress hidden" id="autoDetectProgress">
                  <div class="progress-bar">
                    <div class="progress-bar-fill" id="scanProgressFill"></div>
                  </div>
                  <span class="progress-label" id="scanProgressLabel">0%</span>
                </div>
                <div class="auto-detect-settings hidden" id="autoDetectSettings">
                  <div class="detect-setting">
                    <label>Strictness</label>
                    <input type="range" id="detectStrictness" min="0.5" max="1.6" value="1.0" step="0.05" title="Lower = more plays, higher = fewer false positives">
                    <span class="setting-value" id="strictnessValue">Balanced</span>
                  </div>
                  <div class="detect-setting detect-setting-toggle">
                    <label for="detectUseAudio">Use audio (whistles)</label>
                    <input type="checkbox" id="detectUseAudio" checked>
                  </div>
                  <div class="detect-setting">
                    <label>Min Play (sec)</label>
                    <input type="number" id="detectMinDuration" value="2" min="1" max="15" step="0.5">
                  </div>
                  <div class="detect-setting">
                    <label>Max Play (sec)</label>
                    <input type="number" id="detectMaxDuration" value="30" min="5" max="60" step="1">
                  </div>
                  <div class="detect-setting">
                    <label>Cooldown (sec)</label>
                    <input type="number" id="detectCooldown" value="2.5" min="1" max="15" step="0.5">
                  </div>
                  <div class="detect-hint">
                    Tip: strictness "Balanced" works for most broadcast angles. Raise it if you're getting false positives from crowd shots or replays.
                  </div>
                </div>
                <button class="btn btn-sm btn-link" id="btnToggleDetectSettings">Settings</button>
                <div class="auto-detect-results hidden" id="autoDetectResults">
                  <div class="detect-results-header">
                    <span id="detectResultCount">0 plays detected</span>
                    <div class="detect-results-actions">
                      <button class="btn btn-sm" id="btnReviewDetected" title="Scrub, trim, and accept detections one by one">Review…</button>
                      <button class="btn btn-sm btn-accent" id="btnApplyDetected">Apply All</button>
                    </div>
                  </div>
                  <div class="detect-motion-graph" id="motionGraph">
                    <canvas id="motionGraphCanvas" height="60"></canvas>
                  </div>
                </div>
              </div>
            </div>
          </details>
  </div>
  <div id="giLegacyEngineHost" class="gi-legacy-engine-host" hidden>
  <section class="play-grid-section" id="playGridSection" hidden></section>
  <header class="top-bar">
        <div class="top-bar-left">
          <button class="btn sidebar-toggle" id="btnSidebarToggle" title="Open settings" aria-label="Open settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="4" y1="7" x2="20" y2="7"/>
              <line x1="4" y1="12" x2="20" y2="12"/>
              <line x1="4" y1="17" x2="20" y2="17"/>
            </svg>
            <span class="sidebar-toggle-label">Settings</span>
          </button>
  <button class="btn" id="btnShortcuts" title="Keyboard shortcuts (press ?)" aria-label="Keyboard shortcuts">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="2"/>
              <line x1="6" y1="10" x2="6" y2="10"/><line x1="10" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="14" y2="10"/><line x1="18" y1="10" x2="18" y2="10"/>
              <line x1="7" y1="14" x2="17" y2="14"/>
            </svg>
            <span>Shortcuts</span>
          </button>
          <h1 class="app-title">GridIron <span class="app-iq">IQ</span></h1>
          <!-- The breadcrumb (Team ▸ Season ▸ Game) and its game-switcher dropdown
               were the retired game-entry route (C1). Home is the sole game entry
               and the shell's own `.ws-context` bar duplicates the breadcrumb
               verbatim, so both are deleted rather than left hidden — hidden
               markup is what let the retired flow resurface twice when an overlay
               revealed the classic outlet. -->
        </div>
        <div class="top-bar-center">
          <label class="file-input-label" id="videoDropZone" for="videoFileInput">
            <svg class="icon"><use href="assets/icons.svg#icon-upload"/></svg>
            <span id="fileLabel">Drop video(s) / folder or click to load</span>
          </label>
          <button class="btn btn-sm" id="btnLoadFolder" title="Load an entire folder of plays">
            <svg class="icon"><use href="assets/icons.svg#icon-folder"/></svg>
            <span class="btn-label">Folder</span>
          </button>
          <span class="folder-load-badge hidden" id="folderLoadBadge"></span>
        </div>
        <div class="top-bar-right">
          <button class="backend-status-badge offline" id="backendStatusBadge" type="button"
                  title="Local CV server not detected — using in-browser heuristics. Click to re-probe.">
            Auto-Detect: Basic
          </button>
          <button class="btn btn-icon" id="btnUndoAction" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
            <svg class="icon"><use href="assets/icons.svg#icon-undo"/></svg>
          </button>
          <button class="btn btn-icon" id="btnRedoAction" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
            <svg class="icon"><use href="assets/icons.svg#icon-redo"/></svg>
          </button>
          <button class="btn btn-secondary" id="btnQuickChart" title="Toggle Quick Chart Mode">
            <svg class="icon"><use href="assets/icons.svg#icon-chart"/></svg> <span class="btn-label">Quick Chart</span>
          </button>
          <button class="btn btn-secondary" id="btnShowStats" title="View Game Stats">
            <svg class="icon"><use href="assets/icons.svg#icon-stats"/></svg> <span class="btn-label">Stats</span>
          </button>
          <button class="btn btn-accent" id="btnSave" title="Save the whole season to its file (Ctrl+S)">
            <svg class="icon"><use href="assets/icons.svg#icon-save"/></svg> <span class="btn-label">Save Season</span>
          </button>
        </div>
      </header>
  </div>

  <script type="module" src="js/native-root.jsx"></script>
  <script type="module" src="js/legacy-global-bridge.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
