<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Upload -->
  <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </symbol>

  <!-- Save -->
  <symbol id="icon-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
    <polyline points="17 21 17 13 7 13 7 21"/>
    <polyline points="7 3 7 8 15 8"/>
  </symbol>

  <!-- Folder -->
  <symbol id="icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
  </symbol>

  <!-- Image -->
  <symbol id="icon-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
    <circle cx="8.5" cy="8.5" r="1.5"/>
    <polyline points="21 15 16 10 5 21"/>
  </symbol>

  <!-- Download -->
  <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </symbol>

  <!-- Film -->
  <symbol id="icon-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
    <line x1="7" y1="2" x2="7" y2="22"/>
    <line x1="17" y1="2" x2="17" y2="22"/>
    <line x1="2" y1="12" x2="22" y2="12"/>
    <line x1="2" y1="7" x2="7" y2="7"/>
    <line x1="2" y1="17" x2="7" y2="17"/>
    <line x1="17" y1="7" x2="22" y2="7"/>
    <line x1="17" y1="17" x2="22" y2="17"/>
  </symbol>

  <!-- Play -->
  <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor">
    <polygon points="5 3 19 12 5 21 5 3"/>
  </symbol>

  <!-- Pause -->
  <symbol id="icon-pause" viewBox="0 0 24 24" fill="currentColor">
    <rect x="6" y="4" width="4" height="16"/>
    <rect x="14" y="4" width="4" height="16"/>
  </symbol>

  <!-- Step Back -->
  <symbol id="icon-step-back" viewBox="0 0 24 24" fill="currentColor">
    <rect x="4" y="4" width="3" height="16"/>
    <polygon points="20 4 9 12 20 20 20 4"/>
  </symbol>

  <!-- Step Forward -->
  <symbol id="icon-step-forward" viewBox="0 0 24 24" fill="currentColor">
    <rect x="17" y="4" width="3" height="16"/>
    <polygon points="4 4 15 12 4 20 4 4"/>
  </symbol>

  <!-- Pencil -->
  <symbol id="icon-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h9"/>
    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
  </symbol>

  <!-- Line tool -->
  <symbol id="icon-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="5" y1="19" x2="19" y2="5"/>
  </symbol>

  <!-- Arrow tool -->
  <symbol id="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="19" x2="19" y2="5"/>
    <polyline points="12 5 19 5 19 12"/>
  </symbol>

  <!-- Circle tool -->
  <symbol id="icon-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="9"/>
  </symbol>

  <!-- Rect tool -->
  <symbol id="icon-rect" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="1"/>
  </symbol>

  <!-- Freehand tool -->
  <symbol id="icon-freehand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 17c3-3 5-8 9-8s3 5 6 5 3-3 3-3"/>
  </symbol>

  <!-- Text tool -->
  <symbol id="icon-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="4 7 4 4 20 4 20 7"/>
    <line x1="12" y1="4" x2="12" y2="20"/>
    <line x1="8" y1="20" x2="16" y2="20"/>
  </symbol>

  <!-- Tag -->
  <symbol id="icon-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
    <line x1="7" y1="7" x2="7.01" y2="7"/>
  </symbol>

  <!-- Notes -->
  <symbol id="icon-notes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="16" y1="13" x2="8" y2="13"/>
    <line x1="16" y1="17" x2="8" y2="17"/>
  </symbol>

  <!-- Timeline -->
  <symbol id="icon-timeline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="2" y1="12" x2="22" y2="12"/>
    <circle cx="6" cy="12" r="2" fill="currentColor"/>
    <circle cx="12" cy="12" r="2" fill="currentColor"/>
    <circle cx="18" cy="12" r="2" fill="currentColor"/>
  </symbol>

  <!-- Previous clip -->
  <symbol id="icon-prev-clip" viewBox="0 0 24 24" fill="currentColor">
    <rect x="3" y="4" width="3" height="16"/>
    <polygon points="20 4 9 12 20 20 20 4"/>
    <polygon points="14 4 3 12 14 20 14 4" opacity="0"/>
  </symbol>

  <!-- Next clip -->
  <symbol id="icon-next-clip" viewBox="0 0 24 24" fill="currentColor">
    <rect x="18" y="4" width="3" height="16"/>
    <polygon points="4 4 15 12 4 20 4 4"/>
  </symbol>

  <!-- Scan / Auto-detect -->
  <symbol id="icon-scan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 7V2h5"/>
    <path d="M17 2h5v5"/>
    <path d="M22 17v5h-5"/>
    <path d="M7 22H2v-5"/>
    <line x1="7" y1="12" x2="9" y2="8"/>
    <line x1="9" y1="8" x2="11" y2="14"/>
    <line x1="11" y1="14" x2="13" y2="6"/>
    <line x1="13" y1="6" x2="15" y2="16"/>
    <line x1="15" y1="16" x2="17" y2="12"/>
  </symbol>

</svg>
