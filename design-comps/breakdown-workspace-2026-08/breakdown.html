            </div>
            <label class="gi-autoplay-toggle"><input type="checkbox" checked><span>Autoplay next</span></label>
            <div class="gi-theater-actions-risk">
              <button type="button" class="gi-theater-command">Clear tags</button>
              <button type="button" class="gi-theater-command is-danger">Delete play</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ══ NEW: PLAY RAIL (Chart mode only) — one component, three tiers.
           Sidebar (head+scroll), strip (railStrip), and on-demand toggle
           are all present at once; CSS media queries decide which of the
           three is actually shown at the current width (see section 4/6). ══ -->
      <aside class="gi-play-rail" id="playRail">
        <div class="gi-rail-head">
          <div class="gi-rail-head-label"><span class="gi-eyebrow">Plays</span><span id="railCount">67 plays · grouped by drive</span></div>
          <span class="gi-rail-scroll-hint" id="railScrollHint" role="img" hidden></span>
          <button type="button" class="gi-rail-close" id="playsClose" aria-label="Close plays browser">✕</button>
        </div>
        <div class="gi-rail-scroll" id="railScroll"></div>
        <div class="gi-rail-strip" id="railStrip"></div>
        <button type="button" class="gi-plays-toggle" id="playsToggle" aria-haspopup="true" aria-expanded="false">
          <span id="playsToggleLabel">▤ Plays &middot; 67</span><span class="car">▴ open</span>
        </button>
      </aside>
      <div class="gi-rail-scrim" id="playsScrim"></div>

      <!-- ══ CHARTING DECK (Chart mode only) ══ -->
      <section class="gi-breakdown-deck" id="deck"></section>

      <!-- ══ FILM ROOM (Film Room mode only) ══ -->
      <section class="gi-breakdown-filmroom-host">
        <div class="gi-film-room" id="filmRoom"></div>
      </section>

    </div>
  </main>
</div>

<script>
/* ═══ Fixture data + tiny state-render script. No production wiring — this
   is a static comp; every control below is inert except the state switcher. */
// REVISION (Round 4 repair, finding 4) -- these were the numbers this fix
// exists to correct: the chyron used to hardcode its own values by unit
// ALONE, with no idea which specific play was actually selected, so it
// showed the SAME "Play 47 / 2nd & 12 / Gain +6" facts underneath every
// unit's editor regardless of what that editor's own chip selections said.
// `PLAY_FIXTURES` is now the one place these facts live; the chyron, the
// Film Room detail card, and the rail's own "current" row all read from it
// (or from `D.plays`/`D.filmRoom` entries built to agree with it) instead
// of each hardcoding its own copy. Every value below was checked against
// the corresponding DECKS.* markup's own active chip selections before
// being written -- e.g. Defense's "Offense Faced" chips are Empty/Shotgun/
// 00, so `lookValue` says exactly that, not a value from a different play.
const PLAY_FIXTURES = {
  offense: {
    id: 47, ddText: '2nd &amp; 12', ballText: 'Own 38', hash: 'Right',
    callLabel: 'OUR CALL', callValue: 'Trips Right Stick Draw',
    lookLabel: 'DEFENSE FACED', lookValue: '4-2-5 Nickel · Cover 3 Zone',
    resultText: 'Gain: +6', resultTone: 'pos',
  },
  defense: {
    id: 52, ddText: '3rd &amp; 7', ballText: 'Opp 46', hash: 'Right',
    callLabel: 'OUR CALL', callValue: 'Zone Blitz Fire X · Cover 1',
    lookLabel: 'OFFENSE FACED', lookValue: 'Empty · Shotgun · 00 Personnel',
    resultText: 'Sack: -8', resultTone: 'pos',
  },
  special: {
    id: 61, ddText: '4th &amp; 8', ballText: 'Own 41', hash: 'Middle',
    callLabel: 'PHASE', callValue: 'Punt · Downed',
    lookLabel: '', lookValue: '',
    resultText: 'Downed at Opp 12', resultTone: 'pos',
  },
};
// Which play the rail/strip must highlight as "current" for each unit --
// the same identity `PLAY_FIXTURES` describes, so the highlighted row can
// never point at a different play than the one the deck/chyron are showing.
const CURRENT_ID_BY_UNIT = { offense: 47, defense: 52, special: 61 };

const D = {
  plays: [
    {n:44, drive:'Drive 8 — 3rd Qtr', unit:'offense', down:'1', dist:'10', call:'Zone Read Left', type:'Run Inside', result:'Gain', yds:4, kind:'run'},
    {n:45, drive:'Drive 8 — 3rd Qtr', unit:'offense', down:'2', dist:'6', call:'26 Power O', type:'Run Outside', result:'Gain', yds:9, kind:'run'},
    {n:46, drive:'Drive 8 — 3rd Qtr', unit:'offense', down:'1', dist:'10', call:'Zoom Jet Sweep', type:'Run Outside', result:'Loss', yds:-2, kind:'run'},
    {n:47, drive:'Drive 8 — 3rd Qtr', unit:'offense', down:'2', dist:'12', call:'Trips Right Stick Draw', type:'Short Pass', result:'Gain', yds:6, kind:'pass'},
    {n:48, drive:'Drive 8 — 3rd Qtr', unit:'offense', down:'3', dist:'6', call:'Y-Cross Naked', type:'Deep Pass', result:'Incomplete', yds:0, kind:'pass'},
    {n:49, drive:'Drive 8 — 3rd Qtr', unit:'offense', down:'4', dist:'6', call:'Mesh Concept', type:'Medium Pass', result:'Interception', yds:0, kind:'turnover'},
    {n:50, drive:'Drive 9 — 3rd Qtr · Defense', unit:'defense', down:'1', dist:'10', call:'3-3-5 Nickel · Cover 2 Man', type:'Deep Pass', result:'Incomplete', yds:0, kind:'run'},
    {n:51, drive:'Drive 9 — 3rd Qtr · Defense', unit:'defense', down:'2', dist:'10', call:'4-2-5 Over · Cover 3 Match', type:'Run Inside', result:'Gain', yds:3, kind:'run'},
    {n:52, drive:'Drive 9 — 3rd Qtr · Defense', unit:'defense', down:'3', dist:'7', call:'Zone Blitz Fire X · Cover 1', type:'Short Pass', result:'Sack', yds:-8, kind:'score'},
    // NEW (Round 4 repair, finding 4): the special-teams state's own deck
    // said "Play 61", but the rail's fixture list only ever went up to 52 --
    // there was no play to highlight, so switching to the Special Teams
    // state left the rail showing 47 (offense) as "current" underneath a
    // completely different selected play. Added as its own drive (a punt is
    // ordinarily the last snap of a drive), matching DECKS.special exactly:
    // 4th & 8, Punt, Downed.
    {n:61, drive:'Drive 10 — 4th Qtr · Special Teams', unit:'special', down:'4', dist:'8', call:'Punt · Downed', type:'Punt', result:'Downed', yds:0, kind:'run'},
  ],
  filmRoom: [
    {n:41, dd:'1st & 10', call:'Zone Read Left', form:'Wing-T', qb:'Under Center', type:'Run Inside', result:'Gain', yds:4},
    {n:42, dd:'2nd & 6', call:'26 Power O', form:'I-Form Ace', qb:'Under Center', type:'Run Outside', result:'Gain', yds:9},
    {n:43, dd:'3rd & 2', call:'Sneak', form:'I-Form Ace', qb:'Under Center', type:'Run Inside', result:'Touchdown', yds:2, td:true},
    {n:44, dd:'1st & 10', call:'Zone Read Left', form:'Wing-T', qb:'Under Center', type:'Run Inside', result:'Gain', yds:4},
    {n:45, dd:'2nd & 6', call:'26 Power O', form:'I-Form Ace', qb:'Under Center', type:'Run Outside', result:'Gain', yds:9},
    {n:46, dd:'1st & 10', call:'Zoom Jet Sweep', form:'Trips Right', qb:'Shotgun', type:'Run Outside', result:'Loss', yds:-2},
    {n:47, dd:'2nd & 12', call:'Trips Right Stick Draw', form:'Trips Right', qb:'Shotgun', type:'Short Pass', result:'Gain', yds:6, current:true},
    {n:48, dd:'3rd & 6', call:'Y-Cross Naked', form:'Bunch Left', qb:'Shotgun', type:'Deep Pass', result:'Incomplete', yds:0},
    {n:49, dd:'4th & 6', call:'Mesh Concept', form:'Doubles', qb:'Shotgun', type:'Medium Pass', result:'Interception', yds:0, to:true},
    {n:50, dd:'1st & 10', call:'Punt Coverage', form:'—', qb:'—', type:'Punt', result:'Downed', yds:0},
    {n:51, dd:'2nd & 10', call:'3-3-5 Nickel', form:'Bunch Right', qb:'Shotgun', type:'Deep Pass', result:'Incomplete', yds:0},
    {n:52, dd:'3rd & 7', call:'Zone Blitz Fire X', form:'Empty', qb:'Shotgun', type:'Short Pass', result:'Sack', yds:-8},
    {n:53, dd:'1st & 10', call:'Split Zone', form:'I-Form Ace', qb:'Under Center', type:'Run Inside', result:'Gain', yds:5},
    {n:54, dd:'2nd & 5', call:'Boot Waggle 96', form:'Wing-T', qb:'Under Center', type:'Play Action', result:'Gain', yds:11},
    {n:55, dd:'1st & 10', call:'RPO Bubble', form:'Trips Left', qb:'Shotgun', type:'RPO', result:'Gain', yds:7},
    {n:56, dd:'2nd & 3', call:'Dive', form:'I-Form Ace', qb:'Under Center', type:'Run Inside', result:'Touchdown', yds:3, td:true},
  ],
};
// REVISION (Round 4 repair, finding 4) -- rail HTML is now built PER
// RENDER, parameterized by `currentId`, instead of once at load time from a
// static `p.current` flag. Two real bugs closed by this: (1) the highlighted
// play never updated when the coach state-switched to a different unit, so
// switching to Defense or Special Teams kept Play 47 (offense) highlighted
// under a completely different selected play; (2) the drive-GROUP header's
// own `.is-current` gold treatment checked `p.current` on whichever play
// happened to be FIRST in that drive during the reduce, not on whether the
// group genuinely contained the current play -- since the current play in
// this fixture is never the first play of its own drive, the group header
// highlight could never actually fire. Grouping is now done in a real
// pre-pass (`groupByDrive`) so `.some()` can check the WHOLE group's plays,
// not just the one the old reduce happened to be looking at when it decided
// to open a new group.
function groupByDrive(plays) {
  const groups = [];
  for (const p of plays) {
    const g = groups[groups.length - 1];
    if (!g || g.drive !== p.drive) groups.push({ drive: p.drive, unit: p.unit, plays: [p] });
    else g.plays.push(p);
  }
  return groups;
}
function ddSuffix(down) { return down === '1' ? 'st' : down === '2' ? 'nd' : down === '3' ? 'rd' : 'th'; }
function buildRailHtml(plays, currentId) {
  return groupByDrive(plays).map((g) => {
    const hasCurrent = g.plays.some((p) => p.n === currentId);
    const rows = g.plays.map((p) => {
      const isCurrent = p.n === currentId;
      return `<button type="button" class="gi-play-row is-${p.kind}${isCurrent ? ' is-current' : ''}" data-unit-row="${p.unit}">
    <span class="rn">${p.n}</span><span class="sit">${p.down}${ddSuffix(p.down)} &amp; ${p.dist}</span>
    <span class="call">${p.call} · ${p.type}</span><span class="res">${p.result}${p.yds?(p.yds>0?' +'+p.yds:' '+p.yds):''}</span></button>`;
    }).join('');
    return `<div class="gi-rail-group${hasCurrent ? ' is-current' : ''}"${g.unit === 'defense' ? ' data-unit-row="defense"' : ''}><h3>${g.drive}</h3>${rows}</div>`;
  }).join('');
}

// Tier-2 (1350-1699px) compact strip — a flat row of chips, no drive
// grouping (there's no vertical room for section headers at this height).
function railStripHtml(plays, currentId) {
  if (!plays.length) return '<div class="gi-rail-strip-empty">Plays will appear here once film is added.</div>';
  return plays.map(p => `<button type="button" class="gi-strip-chip is-${p.kind}${p.n === currentId ? ' is-current' : ''}" data-unit-row="${p.unit}">
    <span class="rn">${p.n}</span><span class="sit">${p.down}${ddSuffix(p.down)}&amp;${p.dist}</span>
    <span class="res">${p.result}${p.yds?(p.yds>0?' +'+p.yds:' '+p.yds):''}</span></button>`).join('');
}

// Tier-3 (<1350px) on-demand bottom sheet. The toggle bar reserves ~34px
// permanently; the full list only exists in layout while explicitly open.
// REVISION (Round 4 repair, finding 1): closing was previously reachable
// only by re-pressing the (now-covered) trigger or clicking the scrim, with
// no disclosed affordance and no Escape/focus-return contract -- exactly
// what a real modal-ish overlay needs and this one lacked. `setPlaysOpen`
// is now the single owner of both open AND close, and every dismissal path
// (explicit ✕, Escape, scrim click) returns focus to the trigger that
// opened it, matching this comp's own already-established overlay pattern
// (the transport-overflow menu already returns focus implicitly since it
// never moves it away; the Plays browser genuinely relocates focus into a
// fixed-position panel, so it must genuinely give it back).
function updateRailScrollHint() {
  const list = document.getElementById('railScroll');
  const hint = document.getElementById('railScrollHint');
  const above = list.scrollTop > 1;
  const below = list.scrollHeight - list.clientHeight - list.scrollTop > 1;
  hint.hidden = !list.clientHeight || (!above && !below);
  hint.textContent = above ? (below ? '↕' : '↑') : '↓';
  const label = above ? (below ? 'More plays above and below' : 'More plays above') : 'More plays below';
  hint.title = label;
  hint.setAttribute('aria-label', label);
}
const railList = document.getElementById('railScroll');
railList.addEventListener('scroll', updateRailScrollHint, { passive: true });
new ResizeObserver(updateRailScrollHint).observe(railList);
window.matchMedia('(min-width:1350px)').addEventListener('change', (event) => {
  if (event.matches) setPlaysOpen(false, { silent: true });
});

function setPlaysOpen(open, opts) {
  const wasOpen = document.getElementById('playRail').classList.contains('is-open');
  document.getElementById('playRail').classList.toggle('is-open', open);
  document.getElementById('playsScrim').classList.toggle('is-open', open);
  document.getElementById('playsToggle').setAttribute('aria-expanded', String(open));
  const car = document.querySelector('#playsToggle .car');
  if (car) car.textContent = open ? '▾ close' : '▴ open';
  requestAnimationFrame(updateRailScrollHint);
  if (open) {
    document.getElementById('playsClose').focus();
  } else if (wasOpen && !(opts && opts.silent)) {
    document.getElementById('playsToggle').focus();
  }
}
document.getElementById('playsToggle').addEventListener('click', () => {
  setPlaysOpen(!document.getElementById('playRail').classList.contains('is-open'));
});
document.getElementById('playsClose').addEventListener('click', () => setPlaysOpen(false));
document.getElementById('playsScrim').addEventListener('click', () => setPlaysOpen(false));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('playRail').classList.contains('is-open')) {
    setPlaysOpen(false);
  }
});

// The narrow-width transport overflow menu (review round 3, finding 3).
// A plain toggle + outside-click/Escape close -- no scrim, since the panel
// is small and anchored, not a full route takeover like the play rail.
function setTransportMoreOpen(open) {
  const wrap = document.getElementById('transportMore');
  wrap.classList.toggle('is-open', open);
  document.getElementById('transportMoreBtn').setAttribute('aria-expanded', String(open));
}
document.getElementById('transportMoreBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  setTransportMoreOpen(!document.getElementById('transportMore').classList.contains('is-open'));
});
document.addEventListener('click', (e) => {
  const wrap = document.getElementById('transportMore');
  if (wrap.classList.contains('is-open') && !wrap.contains(e.target)) setTransportMoreOpen(false);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setTransportMoreOpen(false); });

// NEW (Round 4 repair, finding 5) -- real Show/Hide roster behavior. Every
// role card now carries a genuine `data-roster` state and its own
// `.gi-player-quick` grid (previously a role that started collapsed had no
// roster markup to reveal at all), so this is delegated on `document`
// because the deck's own innerHTML is replaced wholesale on every render().
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.gi-player-roster-toggle');
  if (!btn) return;
  const card = btn.closest('[data-roster]');
  if (!card) return;
  const open = card.dataset.roster !== 'open';
  card.dataset.roster = open ? 'open' : 'closed';
  btn.textContent = open ? '▾ Hide roster' : '▸ Show roster';
  btn.setAttribute('aria-expanded', String(open));
});

// REVISION (Round 4 repair, finding 4) -- every value below now comes from
// `PLAY_FIXTURES[unit]` instead of independent per-field ternaries. This is
// what closes the reported defect directly: Defense's editor showed Play
// 52/3rd & 7 while the chyron STILL said Play 47/2nd & 12 (the ternaries
// only ever branched on `unit` for LABEL text, never for which play's data
// to show), and Special Teams' chyron hardcoded "Hash: Right" even though
// the deck's own Hash chip was Middle. Both are now structurally impossible
// -- there is exactly one place these facts are written.
function chyronHtml(unit) {
  const f = PLAY_FIXTURES[unit] || PLAY_FIXTURES.offense;
  const isDef = unit === 'defense';
  return `

    <div class="gi-chyron-cell is-call ${isDef?'is-def':'is-off'}"><span class="gi-chyron-k">${f.callLabel}</span><span class="gi-chyron-v" title="${f.callValue}">${f.callValue}</span></div>

}

function filmRoomHtml() {
  const rows = D.filmRoom.map(r => `<tr class="${r.current ? 'is-current' : ''}">
    <td class="is-check"><input type="checkbox"></td>
    <th class="is-play"><button type="button"><span>${r.type==='Punt'?'S':'O'}</span>${r.n}</button></th>
    <td><button type="button">${r.dd}</button></td>
    <td><button type="button">${r.call}</button></td>
    <td><button type="button">${r.form}</button></td>
    <td><button type="button">${r.qb}</button></td>
    <td><button type="button">${r.type}</button></td>
    <td><button type="button" class="${r.td?'is-td':r.to?'is-turnover':''}">${r.result}</button></td>
    <td><button type="button">${r.yds>0?'+':''}${r.yds}</button></td>
  </tr>`).join('');
  return `
  <div class="gi-film-room-head"><span class="gi-eyebrow">Breakdown table</span><p>67 plays</p>
    <div class="gi-film-room-actions"><button type="button">Columns</button><button type="button" class="is-primary">Watch 3</button></div>
  </div>
  <div class="gi-film-filters">
    <button class="is-active">Offense</button><button>Defense</button><button>Special Teams</button>
    <button>1st</button><button>2nd</button><button>3rd</button><button>4th</button>
    <button>Run</button><button>Pass</button><button>TD</button><button>TO</button><button>Penalty</button><button>Untagged</button>
  </div>
  <div class="gi-film-table-wrap"><table>
    <thead><tr><th class="is-check"><input type="checkbox"></th><th class="is-play">Play</th><th>Dn &amp; Dist</th><th>Play Call</th><th>Formation</th><th>QB Align</th><th>Type</th><th>Result</th><th>Yds</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function render(state) {
  document.documentElement.dataset.state = state;
  const theater = document.getElementById('theater');
  const stage = document.getElementById('stage');
  const chyron = document.getElementById('chyron');
  const deck = document.getElementById('deck');
  const filmRoom = document.getElementById('filmRoom');
  const composition = document.getElementById('composition');
  const pill = document.getElementById('filmPill');
  const ctxGame = document.getElementById('ctxGame');
  const railHead = document.getElementById('railCount');
  const railScroll = document.getElementById('railScroll');
  const modeButtons = document.querySelectorAll('[data-mode-btn]');

  let mode = 'chart', unit = 'offense', stageKind = 'video', deckKey = 'offense', filmRoomFn = filmRoomHtml, filmState = 'linked';

  if (state === 'chart-offense') { unit = 'offense'; deckKey = 'offense'; }
  else if (state === 'chart-defense') { unit = 'defense'; deckKey = 'defense'; }
  else if (state === 'chart-special') { unit = 'special'; deckKey = 'special'; }
  else if (state === 'film-room') { mode = 'film-room'; unit = 'offense'; }
  else if (state === 'missing-film') { unit = 'offense'; deckKey = 'offense'; stageKind = 'missing'; filmState = 'missing'; }
  else if (state === 'sparse') { unit = 'offense'; deckKey = 'sparse'; stageKind = 'empty'; filmState = 'none'; }

  // Which play (by id) is genuinely selected for this state -- the SAME
  // identity the chyron/deck are about to show, so the rail can never
  // highlight a different play (Round 4 repair, finding 4).
  const currentId = CURRENT_ID_BY_UNIT[unit] || 47;

  composition.dataset.mode = mode;
  theater.dataset.unit = unit;
  modeButtons.forEach(b => b.classList.toggle('is-active', b.dataset.modeBtn === mode));
  pill.textContent = filmState === 'missing' ? 'Film needs re-link' : (filmState === 'none' ? 'No film added' : 'Film linked');
  pill.classList.toggle('is-missing', filmState === 'missing');
  pill.classList.toggle('is-none', filmState === 'none');
  ctxGame.textContent = filmState === 'none' ? 'Wk 7 · vs. Cedar Ridge Timberwolves' : 'Wk 6 · vs. Lakeland Christian Crusaders';

  stage.innerHTML = videoStandIn(stageKind);
  if (mode === 'film-room' && stageKind === 'video') {
    stage.insertAdjacentHTML('beforeend', filmRoomDetailHtml());
    const moreEl = stage.querySelector('.fr-more');
    if (moreEl) moreEl.open = window.innerWidth > 1350;
  }
  chyron.innerHTML = (stageKind === 'video') ? chyronHtml(unit) : '';
  chyron.style.visibility = (stageKind === 'video') ? 'visible' : 'hidden';
  chyron.style.minHeight = (stageKind === 'video') ? '' : '0';
  chyron.style.borderTopWidth = (stageKind === 'video') ? '2px' : '0';

  // NEW (review round 3, finding 3): a command that cannot act on anything
  // must be disabled, not merely sit beside copy saying it's unavailable.
  // Covers both no-film (sparse) and failed-to-load (missing) -- neither
  // has a playable video, so neither has a working transport.
  const noPlayableFilm = stageKind !== 'video';
  document.querySelectorAll(
    '.gi-theater-transport button, .gi-theater-transport select, .gi-theater-transport input, ' +
    '.gi-theater-actions button, .gi-theater-actions input, ' +
    '[data-tool="quick-chart"], [data-tool="film-focus"]'
  ).forEach(el => { el.disabled = noPlayableFilm; });
  // Closing the overflow menu when its own trigger just went disabled --
  // pointer-events:none already blocks new opens, but a menu left open
  // from a still-video state before a game switch must not linger.
  if (noPlayableFilm) setTransportMoreOpen(false);

  deck.innerHTML = DECKS[deckKey] || '';
  filmRoom.innerHTML = state === 'film-room' ? filmRoomFn() : (state === 'sparse' ? filmRoomEmptyHtml() : '');

  // A brand-new game has no plays yet -- the rail must say so, not keep
  // showing the fixture game's 67-play drive list underneath it. All three
  // tiers (sidebar, strip, toggle) are kept in sync here regardless of
  // which one CSS is currently displaying, so resizing never shows stale
  // content in the tier that just became visible.
  const railStrip = document.getElementById('railStrip');
  const playsToggleLabel = document.getElementById('playsToggleLabel');
  if (state === 'sparse') {
    railHead.textContent = '0 plays charted yet';
    railScroll.innerHTML = '<div class="gi-rail-empty">Plays will appear here once film is added.</div>';
    railStrip.innerHTML = railStripHtml([], null);
    playsToggleLabel.textContent = '▤ Plays · 0';
  } else {
    railHead.textContent = '67 plays · grouped by drive';
    railScroll.innerHTML = buildRailHtml(D.plays, currentId);
    railStrip.innerHTML = railStripHtml(D.plays, currentId);
    playsToggleLabel.textContent = '▤ Plays · 67';
  }
  setPlaysOpen(false, { silent: true });

  document.querySelectorAll('.qa-bar button').forEach(b => b.classList.toggle('is-on', b.dataset.setState === state));
}

document.querySelectorAll('[data-set-state]').forEach(btn => btn.addEventListener('click', () => render(btn.dataset.setState)));
document.querySelectorAll('[data-mode-btn]').forEach(btn => btn.addEventListener('click', () => {
  render(btn.dataset.modeBtn === 'film-room' ? 'film-room' : 'chart-offense');
}));
render('chart-offense');
</script>
