<!-- @dsCard group="Routes" -->
<meta charset="utf-8">
<title>Route — Break Down (theater)</title>
<style>
:root{
  --t0:#070a0e;--t1:#0b1016;--t2:#111823;
  --d0:#151c26;--d1:#1c2531;--d2:#26313f;--line:#35435440;
  --los:#2f7fff;--fd:#ffd400;--good:#35d07f;--bad:#ff4d5e;
  --ink:#eef3f9;--dim:#93a3b8;--faint:#5d6b7e;
  --ui:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --bd:'Bahnschrift SemiCondensed','Bahnschrift','Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--t0);color:var(--ink);font:14px/1.5 var(--ui)}
.app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto 1fr;height:760px}
/* ---- top bar: chrome recedes, context is scoreboard-voiced ---- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;height:56px;background:var(--t1);border-bottom:1px solid var(--line)}
.brand{font:700 17px/1 var(--bd);letter-spacing:.02em;text-transform:uppercase}
.brand b{color:var(--fd)}
.nav{display:flex;gap:2px;margin-left:10px}
.nav button{border:0;background:transparent;color:var(--faint);font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:4px;cursor:pointer}
.nav button.on{color:var(--ink);background:#ffffff0d;box-shadow:inset 0 -2px 0 var(--los)}
.ctx{margin-left:auto;display:flex;align-items:center;gap:14px}
.bug{display:flex;border:1px solid #ffffff14;border-radius:6px;overflow:hidden}
.bug div{padding:6px 12px;background:#0e151e;display:flex;flex-direction:column;gap:3px}
.bug span{font:600 9px/1 var(--ui);letter-spacing:.14em;color:var(--faint)}
.bug strong{font:700 16px/1 var(--bd);font-variant-numeric:tabular-nums}
.bug .sit{background:var(--los);color:#fff;justify-content:center}
.bug .sit strong{font-size:15px}
/* ---- theater: the film is the brightest thing on screen ---- */
.theater{background:var(--t0);padding:16px 16px 0;display:flex;flex-direction:column;min-width:0}
.film{position:relative;flex:1;border-radius:10px;overflow:hidden;background:
  repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 52px),
  radial-gradient(120% 90% at 50% 20%,#1d2b3a,#0a1119 70%);border:1px solid #ffffff14;box-shadow:0 24px 60px #000000a6}
.film::after{content:'';position:absolute;left:34%;top:0;bottom:0;width:2px;background:var(--los);box-shadow:0 0 16px var(--los)}
.film::before{content:'';position:absolute;left:57%;top:0;bottom:0;width:2px;background:var(--fd);box-shadow:0 0 16px var(--fd)}
.hash{position:absolute;left:0;right:0;height:1px;background:repeating-linear-gradient(90deg,#ffffff26 0 10px,transparent 10px 52px)}
.hash.a{top:33%}.hash.b{top:67%}
.overlay{position:absolute;left:14px;top:12px;display:flex;gap:8px;align-items:center}
.pill{font:700 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:3px;background:#000000a6;border:1px solid #ffffff1f;color:var(--dim)}
.pill.live{background:var(--los);border-color:transparent;color:#fff}
/* ---- transport ---- */
.transport{display:flex;align-items:center;gap:12px;padding:12px 2px 10px}
.tbtn{width:38px;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--t2);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:14px}
.tbtn.play{width:46px;height:46px;background:var(--ink);color:#0a0f16;border:0;font-size:16px}
.scrub{flex:1;height:5px;border-radius:3px;background:#ffffff14;position:relative}
.scrub i{position:absolute;inset:0 62% 0 0;background:var(--los);border-radius:3px}
.time{font:600 12px/1 var(--bd);font-variant-numeric:tabular-nums;color:var(--dim)}
/* ---- field strip: THE signature. plays as yard-line ticks ---- */
.strip{height:58px;margin:0 -16px;padding:8px 16px 0;background:var(--t1);border-top:1px solid var(--line);display:flex;gap:3px;align-items:flex-end}
.p{flex:1;border-radius:2px 2px 0 0;position:relative;cursor:pointer;transition:.09s}
.p i{display:block;border-radius:2px 2px 0 0}
.p .run i{background:var(--fd)}
.p:hover{transform:translateY(-2px)}
.p.sel{outline:2px solid var(--los);outline-offset:1px}
.p.untag i{background:#ffffff17}
.p.run i{background:#c9a227}
.p.pass i{background:#3f6ea8}
.p.td i{background:var(--fd);box-shadow:0 0 10px var(--fd)}
.p.to i{background:var(--bad)}
/* ---- deck: tagging. denser, brighter, distinctly not-film ---- */
.deck{background:var(--d0);border-left:1px solid var(--line);padding:16px;overflow:auto}
.unit{display:flex;gap:2px;background:var(--d1);border:1px solid var(--line);border-radius:7px;padding:3px;margin-bottom:16px}
.unit button{flex:1;border:0;background:transparent;color:var(--dim);font:700 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:10px;border-radius:5px;cursor:pointer}
.unit button.on{background:var(--los);color:#fff}
.grp{margin-bottom:18px}
.grp h4{font:600 10px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.grp h4::after{content:'';flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px/1 var(--ui);padding:9px 12px;border-radius:5px;border:1px solid var(--line);background:var(--d1);color:var(--dim);cursor:pointer;transition:.09s}
.chip:hover{border-color:#4a5b70;color:var(--ink)}
.chip.on{background:var(--los);border-color:var(--los);color:#fff}
.chip.on.gain{background:var(--fd);border-color:var(--fd);color:#191400}
.yards{display:flex;gap:8px;align-items:center;margin-top:4px}
.yards input{flex:1;background:var(--t1);border:1px solid var(--line);border-radius:5px;color:var(--ink);font:700 20px/1 var(--bd);font-variant-numeric:tabular-nums;padding:11px 12px;text-align:center}
.step{width:40px;height:44px;border-radius:5px;border:1px solid var(--line);background:var(--d1);color:var(--ink);font-size:16px;cursor:pointer}
.save{display:flex;gap:8px;margin-top:20px}
.save button{flex:1;height:46px;border-radius:6px;border:0;font:700 12px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.save .prim{background:var(--fd);color:#191400}
.save .sec{background:var(--d2);color:var(--ink);flex:0 0 96px}
.prog{margin-top:14px;font:600 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}
.bar{height:3px;border-radius:2px;background:#ffffff12;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:64%;background:var(--fd)}
</style>
<div class="app">
  <header class="top">
    <div class="brand">GRIDIRON <b>IQ</b></div>
    <nav class="nav">
      <button>Home</button><button class="on">Break Down</button><button>Study</button><button>Reports</button><button>Plan</button>
    </nav>
    <div class="ctx">
      <div class="bug">
        <div><span>MAVERICKS</span><strong>41</strong></div>
        <div><span>ST PETER</span><strong>0</strong></div>
        <div class="sit"><span style="color:#ffffffb3">SITUATION</span><strong>4TH &amp; 2</strong></div>
      </div>
    </div>
  </header>

  <section class="theater">
    <div class="film">
      <div class="hash a"></div><div class="hash b"></div>
      <div class="overlay"><span class="pill live">● Play 28</span><span class="pill">Endzone</span><span class="pill">1.00×</span></div>
    </div>
    <div class="transport">
      <button class="tbtn">⏮</button>
      <button class="tbtn play">▶</button>
      <button class="tbtn">⏭</button>
      <span class="time">00:07.4</span>
      <div class="scrub"><i></i></div>
      <span class="time">00:11.9</span>
      <button class="tbtn">⤢</button>
    </div>
    <div class="strip">
      <span class="p pass"><i style="height:22px"></i></span>
      <span class="p run"><i style="height:15px"></i></span>
      <span class="p run"><i style="height:31px"></i></span>
      <span class="p to"><i style="height:9px"></i></span>
      <span class="p pass"><i style="height:26px"></i></span>
      <span class="p td"><i style="height:40px"></i></span>
      <span class="p run"><i style="height:18px"></i></span>
      <span class="p sel pass"><i style="height:29px"></i></span>
      <span class="p untag"><i style="height:12px"></i></span>
      <span class="p untag"><i style="height:12px"></i></span>
      <span class="p untag"><i style="height:12px"></i></span>
      <span class="p untag"><i style="height:12px"></i></span>
    </div>
  </section>

  <aside class="deck">
    <div class="unit">
      <button class="on">Offense</button><button>Defense</button><button>Special</button>
    </div>

    <div class="grp"><h4>Formation</h4>
      <div class="chips"><span class="chip on">Trips</span><span class="chip">Ace</span><span class="chip">Empty</span><span class="chip">Bunch</span><span class="chip">Wing-T</span></div>
    </div>
    <div class="grp"><h4>QB alignment</h4>
      <div class="chips"><span class="chip on">Shotgun</span><span class="chip">Under Center</span><span class="chip">Pistol</span></div>
    </div>
    <div class="grp"><h4>Play type</h4>
      <div class="chips"><span class="chip">Run In</span><span class="chip">Run Out</span><span class="chip on">Short Pass</span><span class="chip">RPO</span><span class="chip">Screen</span></div>
    </div>
    <div class="grp"><h4>Result</h4>
      <div class="chips"><span class="chip on gain">Gain</span><span class="chip">Loss</span><span class="chip">Incomplete</span><span class="chip">TD</span><span class="chip">Sack</span></div>
    </div>
    <div class="grp"><h4>Yardage</h4>
      <div class="yards"><button class="step">−</button><input value="12"><button class="step">+</button></div>
    </div>

    <div class="save"><button class="prim">Save &amp; next</button><button class="sec">Skip</button></div>
    <div class="prog"><span>Charted</span><span>28 / 44</span></div>
    <div class="bar"><i></i></div>
  </aside>
</div>
